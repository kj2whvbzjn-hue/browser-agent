name: Supabase Browser Session

on:
  workflow_dispatch:
    inputs:
      idle_minutes:
        description: Stop after this many idle minutes
        required: false
        default: '20'
        type: string
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  launch-from-issue:
    if: >-
      github.event_name == 'issues' &&
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[browser-launch]')
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch writable browser session
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run supabase-browser-session.yml --repo "$GH_REPO" --ref main -f idle_minutes=20

  browser-session:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.actor == github.repository_owner || github.actor == 'github-actions[bot]')
    permissions:
      contents: read
    concurrency:
      group: supabase-browser-session
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Install browser and Live View dependencies
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb x11vnc novnc websockify
      - name: Require browser profile encryption key
        env:
          BROWSER_PROFILE_KEY: ${{ secrets.BROWSER_PROFILE_KEY }}
        run: |
          test -n "$BROWSER_PROFILE_KEY" || { echo 'BROWSER_PROFILE_KEY secret is required'; exit 1; }
      - name: Restore encrypted browser profile
        uses: actions/cache/restore@v4
        with:
          path: /tmp/browser-profile.enc
          key: browser-profile-encrypted-${{ github.repository_id }}-${{ github.run_id }}
          restore-keys: |
            browser-profile-encrypted-${{ github.repository_id }}-
      - name: Decrypt browser profile
        env:
          BROWSER_PROFILE_KEY: ${{ secrets.BROWSER_PROFILE_KEY }}
        run: |
          rm -rf /tmp/browser-user-data
          mkdir -p /tmp/browser-user-data
          if [ -f /tmp/browser-profile.enc ]; then
            node scripts/browser-profile-crypto.mjs decrypt /tmp/browser-user-data /tmp/browser-profile.enc
          fi
      - name: Connect runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
      - name: Start display and Live View
        env:
          DISPLAY: ':99'
        run: |
          Xvfb :99 -screen 0 1440x900x24 -ac > /tmp/xvfb.log 2>&1 &
          sleep 2
          x11vnc -display :99 -forever -shared -nopw -listen 0.0.0.0 -rfbport 5900 > /tmp/x11vnc.log 2>&1 &
          websockify --web=/usr/share/novnc 6080 localhost:5900 > /tmp/novnc.log 2>&1 &
          sleep 2
          TS_IP="$(tailscale ip -4 | head -n1)"
          echo "http://${TS_IP}:6080/vnc.html?autoconnect=1&resize=scale" > /tmp/browser-live-url.txt
      - name: Run private Supabase browser session
        env:
          DISPLAY: ':99'
          BROWSER_HEADLESS: 'false'
          BROWSER_USER_DATA_DIR: /tmp/browser-user-data
          BROWSER_SESSION_ID: ${{ github.run_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          IDLE_MINUTES: ${{ github.event.inputs.idle_minutes || '20' }}
        run: |
          export BROWSER_SESSION_IDLE_MS=$((${IDLE_MINUTES:-20} * 60000))
          node scripts/supabase-browser-session-bridge.mjs
      - name: Encrypt persistent browser profile
        if: always()
        env:
          BROWSER_PROFILE_KEY: ${{ secrets.BROWSER_PROFILE_KEY }}
        run: |
          if [ -n "$BROWSER_PROFILE_KEY" ] && [ -d /tmp/browser-user-data ]; then
            node scripts/browser-profile-crypto.mjs encrypt /tmp/browser-user-data /tmp/browser-profile.enc
          fi
          rm -rf /tmp/browser-user-data
      - name: Save encrypted browser profile
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/browser-profile.enc
          key: browser-profile-encrypted-${{ github.repository_id }}-${{ github.run_id }}
