name: B926 AI E2E

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/run-b926-e2e.mjs'
      - '.github/workflows/b926-ai-e2e.yml'

jobs:
  b926-ai-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run B926 AI E2E
        run: node scripts/run-b926-e2e.mjs
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b926-ai-e2e-artifacts
          path: artifacts-b926/
          if-no-files-found: warn
          retention-days: 7
