name: Browser Session Routing E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/github-issue-session-bridge.mjs'
      - 'scripts/test-issue-session-routing.mjs'
      - '.github/workflows/browser-session-routing-e2e.yml'

permissions:
  contents: read

jobs:
  routing-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-issue-session-routing.mjs
