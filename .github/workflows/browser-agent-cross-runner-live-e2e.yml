name: Browser Agent Cross Runner Live E2E

on:
  workflow_dispatch:
  push:
    branches: [experiment/official-chrome-channel]
    paths:
      - 'scripts/run-cross-runner-live-host.mjs'
      - 'scripts/run-cross-runner-live-agent.mjs'
      - '.github/workflows/browser-agent-cross-runner-live-e2e.yml'

permissions:
  contents: read

# This workflow intentionally persists only the AES-encrypted browser profile between
# fresh GitHub-hosted runner generations. A no-op generation marker keeps this file
# available as a safe push trigger for explicit restore E2E runs.
env:
  SPLIT_HOST_E2E_GENERATION: 'C'

jobs:
  browser-host:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y x11vnc novnc websockify socat
      - name: Require browser profile encryption key
        env:
          BROWSER_PROFILE_KEY: ${{ secrets.BROWSER_PROFILE_KEY }}
        run: test -n "$BROWSER_PROFILE_KEY"
      - name: Restore encrypted browser profile
        uses: actions/cache/restore@v4
        with:
          path: /tmp/browser-profile.enc
          key: split-browser-profile-${{ github.repository_id }}-${{ github.run_id }}
          restore-keys: |
            split-browser-profile-${{ github.repository_id }}-
      - name: Decrypt browser profile
        env:
          BROWSER_PROFILE_KEY: ${{ secrets.BROWSER_PROFILE_KEY }}
        run: |
          rm -rf /tmp/browser-user-data
          mkdir -p /tmp/browser-user-data
          if [ -f /tmp/browser-profile.enc ]; then
            node scripts/browser-profile-crypto.mjs decrypt /tmp/browser-user-data /tmp/browser-profile.enc
          fi
      - name: Connect host to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
      - name: Start display and Live View
        run: |
          Xvfb :99 -screen 0 1440x900x24 >/tmp/xvfb.log 2>&1 &
          x11vnc -display :99 -forever -shared -rfbport 5900 -localhost >/tmp/x11vnc.log 2>&1 &
          websockify --web=/usr/share/novnc/ 6080 localhost:5900 >/tmp/novnc.log 2>&1 &
          TS_IP="$(tailscale ip -4 | head -n1)"
          socat TCP-LISTEN:9333,fork,reuseaddr,bind="$TS_IP" TCP:127.0.0.1:9222 &
          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"
      - name: Run split Browser Host
        env:
          DISPLAY: ':99'
          BROWSER_PROFILE_DIR: /tmp/browser-user-data
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CROSS_RUNNER_SESSION_ID: live-${{ github.run_id }}
        run: node scripts/run-cross-runner-live-host.mjs
      - name: Encrypt persistent browser profile
        id: encrypt-profile
        if: ${{ always() && !cancelled() }}
        env:
          BROWSER_PROFILE_KEY: ${{ secrets.BROWSER_PROFILE_KEY }}
        run: |
          set -euo pipefail
          echo "cache_ready=false" >> "$GITHUB_OUTPUT"
          if [ -d /tmp/browser-user-data ]; then
            node scripts/browser-profile-crypto.mjs encrypt /tmp/browser-user-data /tmp/browser-profile.enc.next
            test -s /tmp/browser-profile.enc.next
            mv /tmp/browser-profile.enc.next /tmp/browser-profile.enc
            echo "cache_ready=true" >> "$GITHUB_OUTPUT"
          fi
          rm -rf /tmp/browser-user-data
      - name: Save encrypted browser profile
        if: ${{ always() && !cancelled() && steps.encrypt-profile.outputs.cache_ready == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: /tmp/browser-profile.enc
          key: split-browser-profile-${{ github.repository_id }}-${{ github.run_id }}
      - name: Remove profile material
        if: always()
        run: rm -rf /tmp/browser-user-data /tmp/browser-profile.enc /tmp/browser-profile.enc.next

  browser-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Connect agent to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
      - name: Attach, yield to human, and resume
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CROSS_RUNNER_SESSION_ID: live-${{ github.run_id }}
        run: node scripts/run-cross-runner-live-agent.mjs
