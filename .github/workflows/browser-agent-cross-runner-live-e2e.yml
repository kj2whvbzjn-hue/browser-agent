name: Browser Agent Cross Runner Live E2E

on:
  workflow_dispatch:
  push:
    branches: [experiment/official-chrome-channel]
    paths:
      - 'scripts/run-cross-runner-live-host.mjs'
      - 'scripts/run-cross-runner-live-agent.mjs'
      - '.github/workflows/browser-agent-cross-runner-live-e2e.yml'

permissions:
  contents: read

jobs:
  browser-host:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y x11vnc novnc websockify socat
      - name: Connect host to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
      - name: Start display and Live View
        run: |
          Xvfb :99 -screen 0 1440x900x24 >/tmp/xvfb.log 2>&1 &
          x11vnc -display :99 -forever -shared -rfbport 5900 -localhost >/tmp/x11vnc.log 2>&1 &
          websockify --web=/usr/share/novnc/ 6080 localhost:5900 >/tmp/novnc.log 2>&1 &
          TS_IP="$(tailscale ip -4 | head -n1)"
          socat TCP-LISTEN:9333,fork,reuseaddr,bind="$TS_IP" TCP:127.0.0.1:9222 &
          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"
      - name: Run split Browser Host
        env:
          DISPLAY: ':99'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CROSS_RUNNER_SESSION_ID: live-${{ github.run_id }}
        run: node scripts/run-cross-runner-live-host.mjs

  browser-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Connect agent to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
      - name: Attach, yield to human, and resume
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CROSS_RUNNER_SESSION_ID: live-${{ github.run_id }}
        run: node scripts/run-cross-runner-live-agent.mjs
