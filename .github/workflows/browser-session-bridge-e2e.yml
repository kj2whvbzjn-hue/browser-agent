name: Browser Session Bridge E2E
on:
  workflow_dispatch:
  push:
    branches: [browser-connector-poc]
    paths:
      - 'scripts/browser-session-bridge.mjs'
      - 'scripts/run-session-bridge-e2e.mjs'
      - '.github/workflows/browser-session-bridge-e2e.yml'
      - 'scripts/browser-agent.mjs'
      - 'scripts/page-observer.mjs'
jobs:
  session-bridge-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Test persistent command loop
        run: node scripts/run-session-bridge-e2e.mjs
