name: TSUGU ChatGPT Handoff

on:
  workflow_dispatch:
    inputs:
      cycle:
        description: Continuation cycle number
        required: true
        default: '1'
        type: string
      continuation_text:
        description: Message for the ChatGPT handoff
        required: true
        default: 続行
        type: string
  push:
    branches:
      - feature/tsugu-ai-isolated
    paths:
      - '.github/controls/tsugu-continue.txt'

permissions:
  contents: read

concurrency:
  group: tsugu-chatgpt-handoff
  cancel-in-progress: true

env:
  BROWSER_AGENT_REF: feature/tsugu-ai-isolated
  TSUGU_TARGET_REF: automation/openai-tsugu
  CONTINUE_CYCLE: ${{ inputs.cycle || '1' }}
  CONTINUE_TEXT: ${{ inputs.continuation_text || '続行' }}

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Validate isolated execution
        shell: bash
        run: |
          set -euo pipefail
          test "$BROWSER_AGENT_REF" = "feature/tsugu-ai-isolated"
          test "$TSUGU_TARGET_REF" = "automation/openai-tsugu"
          test "$TSUGU_TARGET_REF" != "main"
          if ! [[ "$CONTINUE_CYCLE" =~ ^[0-9]+$ ]]; then
            echo "Invalid cycle: $CONTINUE_CYCLE" >&2
            exit 1
          fi

      - name: Checkout isolated browser-agent branch
        uses: actions/checkout@v6
        with:
          repository: kj2whvbzjn-hue/browser-agent
          ref: ${{ env.BROWSER_AGENT_REF }}
          path: browser-agent
          persist-credentials: false

      - name: Checkout isolated TSUGU branch read-only
        uses: actions/checkout@v6
        with:
          repository: kj2whvbzjn-hue/tsugu
          ref: ${{ env.TSUGU_TARGET_REF }}
          fetch-depth: 0
          path: tsugu
          persist-credentials: false

      - name: Record isolated baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          TSUGU_SHA=$(git -C tsugu rev-parse HEAD)
          echo "sha=$TSUGU_SHA" >> "$GITHUB_OUTPUT"
          {
            echo "browser_agent_ref=${BROWSER_AGENT_REF}"
            echo "browser_agent_sha=$(git -C browser-agent rev-parse HEAD)"
            echo "tsugu_ref=${TSUGU_TARGET_REF}"
            echo "tsugu_sha=${TSUGU_SHA}"
            echo "cycle=${CONTINUE_CYCLE}"
            echo "mode=read-only-chatgpt-handoff"
          } | tee artifacts/isolation.txt

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Validate handoff script
        run: node --check browser-agent/scripts/build-tsugu-chatgpt-handoff.mjs

      - name: Run TSUGU unit tests
        working-directory: tsugu
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/*.test.cjs; do
            echo "==> $test_file"
            node --test "$test_file"
          done

      - name: Install browser-agent dependencies
        working-directory: browser-agent
        run: npm install

      - name: Install Chromium
        working-directory: browser-agent
        run: npx playwright install --with-deps chromium

      - name: Build local TSUGU site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tsugu/_site
          mkdir -p tsugu/_site artifacts
          cp tsugu/static/index.html tsugu/static/styles.css tsugu/static/favicon.svg tsugu/static/core-*.js tsugu/_site/
          base64 --decode tsugu/static/app.js.gz.b64 | gzip --decompress > tsugu/_site/app.js
          node --check tsugu/_site/app.js
          for file in tsugu/_site/core-*.js; do node --check "$file"; done

      - name: Start local TSUGU server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory tsugu/_site > artifacts/tsugu-server.log 2>&1 &
          echo $! > artifacts/tsugu-server.pid
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat artifacts/tsugu-server.log
          exit 1

      - name: Run Playwright against isolated TSUGU
        id: browser
        continue-on-error: true
        run: node browser-agent/scripts/run-task.mjs browser-agent/projects/tsugu/tasks/smoke-local.json

      - name: Generate browser report
        if: always()
        run: node browser-agent/scripts/generate-report.mjs browser-agent/projects/tsugu/tasks/smoke-local.json

      - name: Build ChatGPT continuation handoff
        if: always()
        env:
          TSUGU_WORKSPACE: tsugu
          BROWSER_REPORT: artifacts/test-report.md
          HANDOFF_OUTPUT: artifacts/chatgpt-continuation.md
          SOURCE_REF: automation/openai-tsugu
          SOURCE_SHA: ${{ steps.baseline.outputs.sha }}
          CYCLE: ${{ env.CONTINUE_CYCLE }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          CONTINUATION_TEXT: ${{ env.CONTINUE_TEXT }}
        run: node browser-agent/scripts/build-tsugu-chatgpt-handoff.mjs

      - name: Verify handoff and prove no TSUGU edits
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/chatgpt-continuation.md
          grep -q '続行' artifacts/chatgpt-continuation.md
          grep -q 'must not delegate development work to Codex' artifacts/chatgpt-continuation.md
          git -C tsugu diff --exit-code
          test -z "$(git -C tsugu status --short --untracked-files=no)"

      - name: Upload ChatGPT handoff evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsugu-chatgpt-handoff-${{ env.CONTINUE_CYCLE }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
