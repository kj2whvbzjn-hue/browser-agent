name: Browser Issue Session

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue used as the browser command/response queue
        required: true
        type: string
      idle_minutes:
        description: Stop after this many idle minutes
        required: false
        default: '20'
        type: string
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: browser-issue-session-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: true

jobs:
  browser-session:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner) ||
      (github.event_name == 'issues' && github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[browser-session]'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Install browser and Live View dependencies
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb x11vnc novnc websockify
      - name: Connect runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
      - name: Start virtual display and iPhone Live View
        env:
          DISPLAY: ':99'
        run: |
          Xvfb :99 -screen 0 1440x900x24 -ac > /tmp/xvfb.log 2>&1 &
          sleep 2
          x11vnc -display :99 -forever -shared -nopw -listen 0.0.0.0 -rfbport 5900 > /tmp/x11vnc.log 2>&1 &
          websockify --web=/usr/share/novnc 6080 localhost:5900 > /tmp/novnc.log 2>&1 &
          sleep 2
          TS_IP="$(tailscale ip -4 | head -n1)"
          LIVE_URL="http://${TS_IP}:6080/vnc.html?autoconnect=1&resize=scale"
          echo "$LIVE_URL" > /tmp/browser-live-url.txt
          echo "IPHONE LIVE VIEW: $LIVE_URL"
      - name: Resolve session settings
        env:
          DISPATCH_ISSUE: ${{ inputs.issue_number }}
          DISPATCH_IDLE_MINUTES: ${{ inputs.idle_minutes }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "issues" ]; then
            ISSUE_NUMBER="$EVENT_ISSUE"
            IDLE_MINUTES="20"
          else
            ISSUE_NUMBER="$DISPATCH_ISSUE"
            IDLE_MINUTES="${DISPATCH_IDLE_MINUTES:-20}"
          fi
          echo "ISSUE_NUMBER=$ISSUE_NUMBER" >> "$GITHUB_ENV"
          echo "IDLE_MINUTES=$IDLE_MINUTES" >> "$GITHUB_ENV"
          echo "SESSION_ID=$GITHUB_RUN_ID" >> "$GITHUB_ENV"
      - name: Post Live View URL to session issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LIVE_URL="$(cat /tmp/browser-live-url.txt)"
          printf '%s\n%s\n%s\n%s\n' "<!-- browser-session-live-view:${SESSION_ID} -->" "Browser session ${SESSION_ID} Live View (Tailscale required):" "$LIVE_URL" "Commands must target sessionId ${SESSION_ID}." > /tmp/live-comment.txt
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/live-comment.txt
      - name: Run Issue-backed browser session
        env:
          DISPLAY: ':99'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BROWSER_HEADLESS: 'false'
          BROWSER_SESSION_ID: ${{ env.SESSION_ID }}
        run: |
          export BROWSER_SESSION_ISSUE="$ISSUE_NUMBER"
          export BROWSER_SESSION_IDLE_MS=$((IDLE_MINUTES * 60000))
          node scripts/github-issue-session-bridge.mjs
