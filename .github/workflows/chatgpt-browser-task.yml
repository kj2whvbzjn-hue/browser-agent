name: ChatGPT Browser Task

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  browser-task:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[browser-task]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install browser and live-view dependencies
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb x11vnc novnc websockify

      - name: Connect runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Start virtual display and iPhone live view
        env:
          DISPLAY: ':99'
        run: |
          Xvfb :99 -screen 0 1440x900x24 -ac > /tmp/xvfb.log 2>&1 &
          sleep 2
          x11vnc -display :99 -forever -shared -nopw -listen 0.0.0.0 -rfbport 5900 > /tmp/x11vnc.log 2>&1 &
          websockify --web=/usr/share/novnc 6080 localhost:5900 > /tmp/novnc.log 2>&1 &
          sleep 2
          TS_IP="$(tailscale ip -4 | head -n1)"
          echo "============================================================"
          echo "IPHONE LIVE VIEW (requires iPhone connected to same Tailscale tailnet)"
          echo "http://${TS_IP}:6080/vnc.html?autoconnect=1&resize=scale"
          echo "============================================================"

      - name: Build task from issue body
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          mkdir -p tasks artifacts-chatgpt
          node <<'NODE'
          const fs = require('fs');
          const raw = process.env.ISSUE_BODY || '';
          const fence = String.fromCharCode(96).repeat(3);
          let text = raw.trim();
          if (text.startsWith(fence)) {
            const firstNewline = text.indexOf('\n');
            const lastFence = text.lastIndexOf(fence);
            if (firstNewline >= 0 && lastFence > firstNewline) {
              text = text.slice(firstNewline + 1, lastFence).trim();
            }
          }
          const task = JSON.parse(text);
          task.outputDir = 'artifacts-chatgpt';
          if (!Array.isArray(task.steps)) throw new Error('Issue JSON must contain steps[]');
          fs.writeFileSync('tasks/chatgpt-issue.json', JSON.stringify(task, null, 2));
          NODE

      - name: Run Playwright task
        env:
          DISPLAY: ':99'
          BROWSER_HEADLESS: 'false'
        run: node scripts/run-task.mjs tasks/chatgpt-issue.json

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-browser-task-${{ github.event.issue.number }}
          path: artifacts-chatgpt/
          if-no-files-found: warn
          retention-days: 7
