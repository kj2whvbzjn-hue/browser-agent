name: ChatGPT Browser Task

on:
  issues:
    types: [opened]

# This workflow intentionally has read-only repository permissions.
permissions:
  contents: read

jobs:
  browser-task:
    # Security gate: only the repository owner can submit executable browser tasks,
    # and the issue title must use the dedicated prefix.
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[browser-task]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build task from issue body
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          mkdir -p tasks artifacts-chatgpt
          node -e "const fs=require('fs'); const raw=process.env.ISSUE_BODY||''; const m=raw.match(/```(?:json)?\\s*([\\s\\S]*?)```/i); const text=(m?m[1]:raw).trim(); const task=JSON.parse(text); task.outputDir='artifacts-chatgpt'; if(!Array.isArray(task.steps)) throw new Error('Issue JSON must contain steps[]'); fs.writeFileSync('tasks/chatgpt-issue.json', JSON.stringify(task,null,2));"

      - name: Run Playwright task
        run: node scripts/run-task.mjs tasks/chatgpt-issue.json

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-browser-task-${{ github.event.issue.number }}
          path: artifacts-chatgpt/
          if-no-files-found: warn
          retention-days: 7
