name: Browser Session Protocol E2E

on:
  workflow_dispatch:
  push:
    branches:
      - browser-session-client-layer
    paths:
      - 'scripts/browser-session-protocol.mjs'
      - 'scripts/run-browser-session-protocol-e2e.mjs'
      - '.github/workflows/browser-session-protocol-e2e.yml'

permissions:
  contents: read

jobs:
  protocol-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/run-browser-session-protocol-e2e.mjs
