name: Browser Rescue Session

on:
  workflow_dispatch:
    inputs:
      idle_minutes:
        description: Stop after this many idle minutes
        required: false
        default: '20'
        type: string

permissions:
  contents: read

concurrency:
  group: browser-rescue-session
  cancel-in-progress: false

jobs:
  rescue-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout pinned rescue branch
        uses: actions/checkout@v4
        with:
          ref: rescue
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Install browser and Live View dependencies
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb x11vnc novnc websockify
      - name: Connect runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
      - name: Start display and Live View
        env:
          DISPLAY: ':99'
        run: |
          Xvfb :99 -screen 0 1440x900x24 -ac > /tmp/xvfb.log 2>&1 &
          sleep 2
          x11vnc -display :99 -forever -shared -nopw -listen 0.0.0.0 -rfbport 5900 > /tmp/x11vnc.log 2>&1 &
          websockify --web=/usr/share/novnc 6080 localhost:5900 > /tmp/novnc.log 2>&1 &
          sleep 2
          TS_IP="$(tailscale ip -4 | head -n1)"
          echo "http://${TS_IP}:6080/vnc.html?autoconnect=1&resize=scale" > /tmp/browser-live-url.txt
      - name: Run rescue browser session
        env:
          DISPLAY: ':99'
          BROWSER_HEADLESS: 'false'
          BROWSER_SESSION_ID: rescue-${{ github.run_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          IDLE_MINUTES: ${{ github.event.inputs.idle_minutes || '20' }}
        run: |
          export BROWSER_SESSION_IDLE_MS=$((${IDLE_MINUTES:-20} * 60000))
          node scripts/supabase-browser-session-bridge.mjs
